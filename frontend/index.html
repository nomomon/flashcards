<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <!-- iOS ignores the web manifest's icons for the home screen. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Flashcards" />
    <title>Flashcards</title>
    <meta
      name="description"
      content="A simple flashcards app for learning languages."
    />
    <!-- Both themes, so the browser chrome matches the page it frames rather
         than staying white behind a dark app. The values are --background from
         index.css, resolved to sRGB. -->
    <meta
      name="theme-color"
      content="#fdfdff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a090f"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Link previews. Absolute URLs because crawlers do not resolve relative
         ones, and the site is served from one known origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Flashcards" />
    <meta
      property="og:description"
      content="Dutch flashcards with no accounts and no backend. A deck is a text file, so adding a word is adding a line."
    />
    <meta
      property="og:image"
      content="https://flashcards.nomomon.xyz/social.jpg"
    />
    <meta property="og:url" content="https://flashcards.nomomon.xyz/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
